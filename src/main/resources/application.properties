spring.application.name=CadernoDeReceitas
# String de conexão (substitua "nome_do_seu_banco" pelo nome real)
spring.datasource.url=jdbc:postgresql://localhost:5432/cadernoDeReceitas
spring.datasource.username=postgres
spring.datasource.password=2006

# Driver e Dialeto (o Spring Boot geralmente detecta sozinho, mas garante compatibilidade)
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate (mantém o comportamento de criar/atualizar tabelas)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true